# The demo terminal: one tab (tmux window) per job, drawn as a tab strip
# at the top so the tabs are part of the recording itself.
set -g default-terminal "xterm-256color"
set -g mouse off
set -g escape-time 0
set -g history-limit 20000
set -g automatic-rename off
set -g allow-rename off
set -g base-index 0

set -g status on
set -g status-position top
set -g status-justify left
set -g status-style "bg=#161616,fg=#8a8a8a"
set -g status-left ""
set -g status-right "#[fg=#5f5f5f]~/shorty "
set -g window-status-separator " "
set -g window-status-format "#[fg=#8a8a8a,bg=#262626]  #W  "
set -g window-status-current-format "#[fg=#f0f0f0,bg=#3a3a3a,bold]  #W  "
