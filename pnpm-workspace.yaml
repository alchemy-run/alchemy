onlyBuiltDependencies:
  - "@parcel/watcher"
  - esbuild
  - sharp
  - workerd

allowBuilds:
  "@parcel/watcher": true
  core-js: false
  es5-ext: false
  # Prisma 7 (prisma playground fixture): `generate` needs no downloaded engines.
  "@prisma/engines": false
  prisma: false
  esbuild: true
  sharp: true
  vue-demi: false
  workerd: true

# Recursive `pnpm -r run` task graph. Builds are never triggered by install.
# Each package's `build` runs `build:package` (its own compile step) over
# itself and its workspace dependencies, so `pnpm build` in any package
# builds what it needs first.
tasks:
  build:package:
    dependsOn:
      - ^build:package
  # Callers build first (see `typecheck:cloudflare-packages` and
  # `test:cloudflare-packages`), so these don't re-run builds.
  typecheck:
    dependsOn: []
  test:
    dependsOn: []

packages:
  - website
  - packages/*
  - examples/*
  - examples/cloudflare-domain/packages/*
  - examples/cloudflare-website-service-bindings/apps/*
  - examples/monorepo-single-stack/*
  - examples/monorepo-multi-stack/*
  - benchmark/*
  - demos/*
  - submodules/distilled/packages/*
  - packages/frontend-frameworks/fixtures/*
  - packages/frontend-frameworks/src/nextjs/wrangler-stub

