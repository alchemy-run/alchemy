catalogs:
  # Cloudflare's worker test plugin does not yet support Vitest 5.
  cloudflare-test-compat:
    vitest: "^4.1.8"
  # SvelteKit requires the TypeScript JavaScript compiler API.
  typescript-classic:
    typescript: "6.0.3"
  # Compatibility ranges used by published optional peer dependencies.
  frontend-peer:
    "@octanejs/vite-plugin": ">=0.1.22"
    "@sveltejs/kit": ">=3.0.0"
    astro: "^7.0.0"
    nuxt: ">=4.5.0"
