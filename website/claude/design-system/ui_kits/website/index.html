<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>alchemy — Infrastructure-as-Effects</title>
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <style>
    html, body { margin: 0; padding: 0; background: var(--alc-bg); color: var(--alc-fg-2); font-family: var(--alc-font-sans); -webkit-font-smoothing: antialiased; }
    .alc-provider-card:hover { border-color: var(--alc-accent) !important; }
    a:focus-visible { outline: 2px solid var(--alc-accent); outline-offset: 2px; }
  </style>
</head>
<body class="alc-root">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="Nav.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="HeroCode.jsx"></script>
  <script type="text/babel" src="Terminal.jsx"></script>
  <script type="text/babel" src="FeatureGrid.jsx"></script>
  <script type="text/babel" src="Sections.jsx"></script>

  <script type="text/babel">
    function HeroSection() {
      return (
        <section style={{ maxWidth: 980, margin: "0 auto", padding: "0 32px 80px" }}>
          <HeroCode>
{T.c("// alchemy.run.ts")}{"\n"}
{T.k("import")} * {T.k("as")} {T.v("Alchemy")} {T.k("from")} {T.s('"alchemy"')};{"\n"}
{T.k("import")} * {T.k("as")} {T.v("Cloudflare")} {T.k("from")} {T.s('"alchemy/Cloudflare"')};{"\n"}
{"\n"}
{T.k("const")} {T.v("Bucket")} = {T.v("Cloudflare")}.{T.f("R2Bucket")}({T.s('"Bucket"')});{"\n"}
{"\n"}
{T.k("export default")} {T.v("Alchemy")}.{T.f("Stack")}({T.s('"MyApp"')}, {"{"}{"\n"}
{"  "}providers: {T.v("Cloudflare")}.{T.f("providers")}(),{"\n"}
{"}"}, {T.v("Effect")}.{T.f("gen")}({T.k("function")}* () {"{"}{"\n"}
{"  "}{T.k("const")} bucket = {T.k("yield")}* {T.v("Bucket")};{"\n"}
{"  "}{T.k("return")} {"{ "}url: bucket.bucketName {"}"};{"\n"}
{"}"}));
          </HeroCode>
        </section>
      );
    }
    function App() {
      return (
        <div data-screen-label="Website / Landing">
          <Nav />
          <Hero />
          <HeroSection />
          <FeatureGrid />
          <ProviderCards />
          <CTA />
          <Footer />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
