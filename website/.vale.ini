# Prose linter for the hand-written docs. See STYLE.md.
StylesPath = .vale/styles
MinAlertLevel = warning
Packages = Google

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Vale, Google, Alchemy

# Skip MDX import/export lines and JSX component blocks.
BlockIgnores = (?m)^import .*$, (?sm)^export .+?^\};?$
TokenIgnores = (<[A-Z][A-Za-z.]*[^>]*/?>), (</[A-Z][A-Za-z.]*>)

# Code identifiers make spell-checking too noisy.
Vale.Spelling = NO
# Google wants unspaced em dashes. Alchemy limits em dashes instead.
Google.EmDash = NO
# Replaced by Alchemy.Headings, which knows product names.
Google.Headings = NO
# Alchemy.ClauseColon covers colons. Google.Colons flags list labels.
Google.Colons = NO
# Literal values in quotes keep their punctuation outside.
Google.Quotes = NO
# Google's word list rejects terms we use on purpose (CLI, app).
Google.WordList = suggestion
Google.WordListCase = suggestion
Google.OxfordComma = suggestion
Google.Units = suggestion
# Flags dotted identifiers such as Website.Vite written outside code spans.
Google.Spacing = NO
