<svg viewBox="0 0 780 430" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Cumulative typed-error/schema patch files in distilled/packages/cloudflare/patches,
       measured at each alchemy->distilled submodule pointer change, Jun 11-19 2026 (PT).
       Data: git ls-tree -r <pointer> packages/cloudflare/patches | grep -c '.json$' -->
  <text x="70" y="20" font-size="14" fill="#9ca3af">Patched operations in the distilled Cloudflare SDK (cumulative)</text>

  <!-- gridlines + y labels (0..1200 step 200) -->
  <g stroke="#9ca3af" stroke-opacity="0.25" stroke-width="1">
    <line x1="70" y1="350" x2="740" y2="350"/>
    <line x1="70" y1="296.7" x2="740" y2="296.7"/>
    <line x1="70" y1="243.3" x2="740" y2="243.3"/>
    <line x1="70" y1="190" x2="740" y2="190"/>
    <line x1="70" y1="136.7" x2="740" y2="136.7"/>
    <line x1="70" y1="83.3" x2="740" y2="83.3"/>
    <line x1="70" y1="30" x2="740" y2="30"/>
  </g>
  <g font-size="12" fill="#9ca3af" text-anchor="end">
    <text x="62" y="354">0</text>
    <text x="62" y="300.7">200</text>
    <text x="62" y="247.3">400</text>
    <text x="62" y="194">600</text>
    <text x="62" y="140.7">800</text>
    <text x="62" y="87.3">1,000</text>
    <text x="62" y="34">1,200</text>
  </g>

  <!-- x labels (Jun 11..Jun 19) -->
  <g font-size="12" fill="#9ca3af" text-anchor="middle">
    <text x="70" y="372">Jun 11</text>
    <text x="153.75" y="372">Jun 12</text>
    <text x="237.5" y="372">Jun 13</text>
    <text x="321.25" y="372">Jun 14</text>
    <text x="405" y="372">Jun 15</text>
    <text x="488.75" y="372">Jun 16</text>
    <text x="572.5" y="372">Jun 17</text>
    <text x="656.25" y="372">Jun 18</text>
    <text x="740" y="372">Jun 19</text>
  </g>

  <!-- release markers -->
  <g stroke="#9ca3af" stroke-opacity="0.6" stroke-width="1" stroke-dasharray="4 4">
    <line x1="549" y1="30" x2="549" y2="350"/>
    <line x1="739" y1="30" x2="739" y2="350"/>
  </g>
  <text x="553" y="330" font-size="12" fill="#9ca3af">beta.56</text>
  <text x="735" y="330" font-size="12" fill="#9ca3af" text-anchor="end">beta.57</text>

  <!-- the step line -->
  <path d="M107.7,251.6 H192.9 V63.3 H196.8 V61.2 H207.9 V61.8 H456.2 V62.0 H533.0 V61.2 H547.3 V60.1 H632.1 V58.8 H736.1 V58.5 H740"
        fill="none" stroke="#f6821f" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- annotated points -->
  <circle cx="107.7" cy="251.6" r="4" fill="#f6821f"/>
  <text x="116" y="248" font-size="12.5" fill="#9ca3af">distilled embedded — 369 patches</text>

  <circle cx="192.9" cy="63.3" r="4" fill="#f6821f"/>
  <text x="201" y="52" font-size="12.5" fill="#9ca3af">PR #601 merged — 1,075</text>

  <circle cx="736.1" cy="58.5" r="4" fill="#f6821f"/>
  <text x="640" y="90" font-size="12.5" fill="#9ca3af">1,093 by beta.57</text>

  <!-- axis line -->
  <line x1="70" y1="30" x2="70" y2="350" stroke="#9ca3af" stroke-opacity="0.5" stroke-width="1"/>

  <text x="70" y="404" font-size="11.5" fill="#9ca3af">One file per operation under distilled/packages/cloudflare/patches, counted at every submodule pointer the alchemy repo pinned.</text>
</svg>
