receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    timeout: 100ms
  decouple:
    max_queue_size: 200
  resource:
    attributes:
      - key: app_id
        value: alchemy-test
        action: upsert
      - key: deployment.environment
        value: testing
        action: upsert

exporters:
  otlphttp/axiom-traces:
    compression: zstd
    endpoint: ${env:AXIOM_OTLP_ENDPOINT}
    headers:
      authorization: Bearer ${env:AXIOM_INGEST_TOKEN}
      x-axiom-dataset: ${env:AXIOM_TRACES_DATASET}
  otlphttp/axiom-logs:
    compression: zstd
    endpoint: ${env:AXIOM_OTLP_ENDPOINT}
    headers:
      authorization: Bearer ${env:AXIOM_INGEST_TOKEN}
      x-axiom-dataset: ${env:AXIOM_EVENTS_DATASET}

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch, decouple]
      exporters: [otlphttp/axiom-traces]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch, decouple]
      exporters: [otlphttp/axiom-logs]
