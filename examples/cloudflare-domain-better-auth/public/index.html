<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notes</title>
    <style>
      body {
        max-width: 36rem;
        margin: 3rem auto;
        padding: 0 1rem;
        font:
          1rem/1.5 system-ui,
          sans-serif;
      }
      button {
        margin-right: 0.5rem;
        padding: 0.5rem 0.75rem;
      }
    </style>
  </head>
  <body>
    <h1>Notes</h1>
    <section id="signed-out" hidden>
      <button id="github" type="button">Sign in with GitHub</button>
      <button id="google" type="button">Sign in with Google</button>
    </section>
    <section id="signed-in" hidden>
      <p id="greeting"></p>
      <form id="write">
        <input id="text" required placeholder="Write a note" />
        <button type="submit">Save</button>
      </form>
      <ul id="notes"></ul>
      <button id="sign-out" type="button">Sign out</button>
    </section>
    <script type="module" src="/page.js"></script>
  </body>
</html>
