receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    timeout: 1s
  decouple:
    # Once full, this in-memory queue applies backpressure to the function's
    # local export. It improves latency; it does not make delivery durable.
    max_queue_size: 200

exporters:
  otlphttp:
    endpoint: ${env:COLLECTOR_EXPORTER_OTLP_ENDPOINT}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, decouple]
      exporters: [otlphttp]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, decouple]
      exporters: [otlphttp]
