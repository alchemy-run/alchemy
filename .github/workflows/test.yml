name: test

# Smoke-tests `alchemy destroy → deploy → destroy` against each example with
# both bun and pnpm. SMOKE_CANARY=1 makes the test publish tarballs to pkg.ing
# under a fresh tag and install them into the examples before running.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  # Required for aws-actions/configure-aws-credentials to mint a session
  # via OIDC instead of long-lived AWS_ACCESS_KEY_ID secrets.
  id-token: write

env:
  PKGING_HOST: pkg.ing
  NODE_VERSION: "24"
  # PR runs use `pr-<n>` so each PR has its own isolated cloud namespace;
  # main pushes use `main`; manual `workflow_dispatch` runs use the branch
  # name. Forwarded to the smoke test as $SMOKE_STAGE.
  SMOKE_STAGE: ${{ github.event_name == 'pull_request' && format('pr-{0}',
    github.event.number) || (github.ref == 'refs/heads/main' && 'main' ||
    github.ref_name) }}

concurrency:
  # Cancel an in-progress run for the same PR (or branch) when a new push
  # arrives — the smoke suite mutates real cloud state, so two parallel
  # runs against the same SMOKE_STAGE would race.
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install

      # OIDC → short-lived AWS session. Exports AWS_ACCESS_KEY_ID,
      # AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN, AWS_REGION; the
      # `output-credentials: true` flag also surfaces AWS_ACCOUNT_ID.
      # Alchemy's AWS env loader (packages/alchemy/src/AWS/Environment.ts)
      # picks the env path automatically when AWS_ACCESS_KEY_ID is set.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          output-credentials: true

      - name: Smoke
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.TEST_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TEST_CLOUDFLARE_ACCOUNT_ID }}
          PR_PACKAGE_TOKEN: ${{ secrets.PR_PACKAGE_TOKEN }}
          PKGING_HOST: ${{ env.PKGING_HOST }}
          SMOKE_CANARY: "1"
          SMOKE_STAGE: ${{ env.SMOKE_STAGE }}
        run: bun test:smoke
