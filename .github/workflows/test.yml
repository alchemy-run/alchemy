name: test

# Smoke-tests `alchemy destroy → deploy → destroy` against each example with
# both bun and pnpm. SMOKE_CANARY=1 makes the test publish tarballs to pkg.ing
# under a fresh tag and install them into the examples before running.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runtime:
        description: "Runtime to test (bun, pnpm, or both)"
        required: false
        default: "both"
        type: choice
        options: ["both", "bun", "pnpm"]

permissions:
  contents: read
  # Required for aws-actions/configure-aws-credentials to mint a session
  # via OIDC instead of long-lived AWS_ACCESS_KEY_ID secrets.
  id-token: write

env:
  PKGING_HOST: pkg.ing
  NODE_VERSION: "24"
  AWS_REGION: us-west-2

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install

      # OIDC → short-lived AWS session. Exports AWS_ACCESS_KEY_ID,
      # AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN, AWS_REGION; the
      # `output-credentials: true` flag also surfaces AWS_ACCOUNT_ID.
      # Alchemy's AWS env loader (packages/alchemy/src/AWS/Environment.ts)
      # picks the env path automatically when AWS_ACCESS_KEY_ID is set.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TEST_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          output-credentials: true

      - name: Smoke
        env:
          # Cloudflare creds for the cloudflare-* examples.
          CLOUDFLARE_API_KEY: ${{ secrets.ADMIN_CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.ADMIN_CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TEST_CLOUDFLARE_ACCOUNT_ID }}
          # AWS_* (ACCESS_KEY_ID / SECRET / SESSION_TOKEN / ACCOUNT_ID /
          # REGION) are already exported by configure-aws-credentials, so
          # nothing more to plumb through here.
          # pkg.ing publish token for the canary path. Locally the smoke
          # test falls back to `doppler secrets get`; in CI we set it
          # directly so Doppler isn't needed on the runner.
          PR_PACKAGE_TOKEN: ${{ secrets.PR_PACKAGE_TOKEN }}
          PKGING_HOST: ${{ env.PKGING_HOST }}
          SMOKE_CANARY: "1"
          SMOKE_RUNTIMES: ${{ inputs.runtime == 'both' && '' || inputs.runtime }}
        run: bun test:smoke
