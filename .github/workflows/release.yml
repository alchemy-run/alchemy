name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Release spec. Empty = next beta. `patch|minor|major` or `x.y.z`
          for a stable release. `beta` / `beta.N` / `alpha` / `alpha.N`
          for a prerelease. Anything else = tag release on
          `0.0.0-<name>`.
        required: false
        type: string
        default: ""
      force-latest:
        description: >-
          Publish under npm's `latest` dist-tag regardless of channel. On
          by default — 2.0 prereleases are the effective current release,
          so `latest` follows whatever we publish. Uncheck to cut a release
          that stays off `latest` (it lands on `next` instead). If the
          version is already on npm, its `latest` tag is moved rather than
          the publish skipped.
        required: false
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Reusable workflows can't widen permissions — the caller must grant
# `contents: write` (commit + tag) and `id-token: write` (npm OIDC).
permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: alchemy-run/actions/.github/workflows/release.yml@ba080391343b21c18ff098868e0c932e469da0aa # main
    with:
      # The bun workspace includes `distilled/packages/*` from the
      # distilled submodule, so consumer checkouts must fetch it.
      submodules: "true"
      node-version: "24"
      version: ${{ inputs.version }}
      force-latest: ${{ inputs.force-latest }}
      repo: alchemy-run/alchemy
      current-version: "2.0.0"
      # Each package builds in its own publish job: the tsc build pulls
      # in the alchemy -> distilled project-reference chain (distilled/aws
      # is huge), which doesn't fit the bump job's ubuntu-latest box.
      build-mode: per-package
      # Turbo scopes the build to the package being published and builds its
      # workspace dependencies first. Each package build copies its shared
      # license metadata, and alchemy also copies the repo-root README.
      build-command: >-
        PKG_NAME=$(node -p "require('./package.json').name");
        cd ../..;
        bun turbo run build --filter="$PKG_NAME"
      packages: |
        [
          { "dir": "packages/alchemy",            "name": "alchemy",                         "runner": "ubuntu-22-large" },
          { "dir": "packages/better-auth",        "name": "@alchemy.run/better-auth",        "runner": "ubuntu-22-large" },
          { "dir": "packages/cloudflare-runtime", "name": "@alchemy.run/cloudflare-runtime", "runner": "ubuntu-22-large" },
          { "dir": "packages/frontend-frameworks",         "name": "@alchemy.run/frontend-frameworks",         "runner": "ubuntu-22-large" },
          { "dir": "packages/node-utils",       "name": "@alchemy.run/node-utils",       "runner": "ubuntu-22-large" },
          { "dir": "packages/pr-package",         "name": "@alchemy.run/pr-package",         "runner": "ubuntu-22-large" }
        ]
    secrets: inherit
