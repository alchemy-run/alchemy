name: website

on:
  # Manual override — deploys unconditionally on whatever branch it's run
  # from (use this to force a prod deploy from main without a release).
  workflow_dispatch:
  # No `paths` filter on push: every main commit updates main.alchemy.run,
  # while release commits update production regardless of which files they
  # touch.
  push:
    branches:
      - main
  pull_request:
    # `labeled` so adding `deploy-website` on an open PR triggers a
    # deploy without needing another push.
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - closed
    paths:
      - "website/**"
      - "packages/alchemy/**"
      - "bun.lock"
      - ".github/workflows/website.yml"

concurrency:
  group: deploy-website-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  STAGE: ${{ github.event_name == 'pull_request' && format('pr-{0}',
    github.event.number) || (github.event_name == 'workflow_dispatch' ||
    startsWith(github.event.head_commit.message, 'chore(release):')) && 'prod' ||
    (github.ref == 'refs/heads/main' && 'main' || github.ref_name) }}

jobs:
  deploy:
    # Deploy every push to main. Release commits (`chore(release): x.y.z`)
    # and manual dispatches deploy production; other main commits deploy to
    # main.alchemy.run. On PRs, require BOTH:
    #   - the PR is internal (forks can't access bot/Cloudflare secrets
    #     so `create-github-app-token` would error immediately), AND
    #   - the PR carries the `deploy-website` label (opt-in — most PRs
    #     don't need a website preview, so default to skipping).
    if: >-
      github.event.action != 'closed' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'deploy-website')))
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # `bun install` needs the distilled submodule (workspace member)
          submodules: true

      # Mint a token for the alchemy-version-bot GitHub App so the PR
      # preview comment (created via GitHub.Comment in alchemy.run.ts)
      # posts under the bot's identity instead of `github-actions[bot]`.
      # Same App as release.yml — its installation scopes already cover
      # PR comments.
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.ALCHEMY_VERSION_BOT_ID }}
          private-key: ${{ secrets.ALCHEMY_VERSION_BOT_PRIVATE_KEY }}

      - uses: alchemy-run/actions/actions/setup@ab9b8d7a9e09390ba578b85373dcac972bf3edc4 # actions#10
        with:
          node-version: ${{ env.NODE_VERSION }}
          install: "false"

      - name: Restore Astro build cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: website/node_modules/.astro
          key: astro-${{ runner.os }}-${{ github.event.pull_request.number || 'main' }}-${{ github.sha }}
          restore-keys: |
            astro-${{ runner.os }}-${{ github.event.pull_request.number || 'main' }}-
            astro-${{ runner.os }}-main-

      - name: Install dependencies
        run: bun install

      # Secrets (Cloudflare credentials, etc.) are injected by
      # `doppler run` from the `alchemy-v2` project — `prod` config on
      # main, `dev` config everywhere else.
      - name: Deploy
        working-directory: website
        run: bun alchemy deploy --stage "$STAGE" --yes
        env:
          PULL_REQUEST: ${{ github.event.number }}
          CLOUDFLARE_API_TOKEN: ${{ (env.STAGE == 'main' || env.STAGE == 'prod') && secrets.PROD_CLOUDFLARE_API_TOKEN || secrets.TEST_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ (env.STAGE == 'main' || env.STAGE == 'prod') && secrets.PROD_CLOUDFLARE_ACCOUNT_ID || secrets.TEST_CLOUDFLARE_ACCOUNT_ID }}
          BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}

  cleanup:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # `bun install` needs the distilled submodule (workspace member)
          submodules: true

      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.ALCHEMY_VERSION_BOT_ID }}
          private-key: ${{ secrets.ALCHEMY_VERSION_BOT_PRIVATE_KEY }}

      - uses: alchemy-run/actions/actions/setup@ab9b8d7a9e09390ba578b85373dcac972bf3edc4 # actions#10
        with:
          node-version: ${{ env.NODE_VERSION }}
          install: "false"

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4

      - name: Install dependencies
        run: bun install

      - name: Safety Check
        run: |-
          if [ "${{ env.STAGE }}" = "prod" ]; then
            echo "ERROR: Cannot destroy prod environment in cleanup job"
            exit 1
          fi

      - name: Destroy Preview Environment
        working-directory: website
        run: >-
          doppler run --project "$DOPPLER_PROJECT" --config "$DOPPLER_CONFIG"
          -- bun alchemy destroy --stage "$STAGE" --yes
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          PULL_REQUEST: ${{ github.event.number }}
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
