name: cloudflare-tools

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  test:
    # GitHub does not expose repository secrets to fork pull requests. Keep
    # the secret-backed test matrix on trusted refs while still running it for
    # pushes, manual dispatches, and pull requests from this repository.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    name: Cloudflare tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - blacksmith-8vcpu-ubuntu-2404
          - blacksmith-6vcpu-macos-latest
          - blacksmith-8vcpu-windows-2025
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # `bun install` needs the distilled submodule (workspace member).
          submodules: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: bun-cache
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # bun on Windows cannot rename a freshly patched package over a stale
      # cache entry (ENOTEMPTY, oven-sh/bun#18248), and a failed job never
      # saves its cache — so once a `patchedDependencies` change lands, the
      # restore-keys fallback keeps restoring the pre-patch cache and every
      # install wedges. On an exact-key miss (lockfile changed), start from
      # a clean install cache; exact hits skip this and stay warm.
      - if: runner.os == 'Windows' && steps.bun-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: bun pm cache rm

      - run: bun install
      - run: bun run typecheck:cloudflare-packages
      - name: Test
        run: bun run test:cloudflare-packages -- ${{ runner.os == 'Windows' && '--concurrency=3' || runner.os == 'macOS' && '--concurrency=2' || '' }}
        env:
          TEST_MYSQL_URL: ${{ secrets.TEST_MYSQL_URL }}
          TEST_POSTGRES_URL: ${{ secrets.TEST_POSTGRES_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TEST_KV_NAMESPACE_ID: ${{ secrets.TEST_KV_NAMESPACE_ID }}
          TEST_R2_BUCKET_NAME: ${{ secrets.TEST_R2_BUCKET_NAME }}
          TEST_D1_DATABASE_ID: ${{ secrets.TEST_D1_DATABASE_ID }}
          TEST_SERVICE_WORKER_NAME: ${{ secrets.TEST_SERVICE_WORKER_NAME }}
