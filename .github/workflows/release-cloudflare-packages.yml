name: release-cloudflare-packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Release spec. Empty = next beta. `patch|minor|major` or `x.y.z`
          for a stable release; prerelease names are also supported.
        required: false
        type: string
        default: ""

concurrency:
  group: release-cloudflare-packages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: alchemy-run/actions/.github/workflows/release.yml@2ba4aab624950338968f1598bdfe34804244a77a # main
    with:
      submodules: "true"
      version: ${{ inputs.version }}
      repo: alchemy-run/alchemy
      current-version: "0.17.1"
      build-mode: per-package
      build-command: >-
        PKG_NAME=$(node -p "require('./package.json').name");
        cd ../..;
        bun turbo run build --filter="$PKG_NAME"
      packages: |
        [
          { "dir": "packages/cloudflare-runtime", "name": "@alchemy.run/cloudflare-runtime", "runner": "ubuntu-22-large" },
          { "dir": "packages/frameworks",         "name": "@alchemy.run/frameworks",         "runner": "ubuntu-22-large" }
        ]
    secrets: inherit
