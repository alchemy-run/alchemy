name: pr-package

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` so adding the `force-ci` label re-triggers the run.
    types: [opened, synchronize, reopened, closed, labeled]

# Reusable workflows can't widen permissions — the caller must grant
# `pull-requests: write` (sticky install-instructions comment + cleanup
# on PR close).
permissions:
  contents: read
  pull-requests: write

jobs:
  pr-package:
    uses: alchemy-run/actions/.github/workflows/pr-package.yml@main
    with:
      # build-command runs inside each package's `dir`. Copy the repo-root
      # README into the package (harmless `|| true` where it doesn't apply),
      # then run that package's own build (overriding the default drops it).
      build-command: "cp ../../README.md . 2>/dev/null || true; bun run build"
      packages: |
        [
          { "dir": "packages/alchemy",     "name": "alchemy" },
          { "dir": "packages/better-auth", "name": "@alchemy.run/better-auth" },
          { "dir": "packages/pr-package",  "name": "@alchemy.run/pr-package" }
        ]
    secrets: inherit
