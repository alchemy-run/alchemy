name: pr-package

# Publishes alchemy + better-auth tarballs to the pr-package service at
# 📦.alchemy.run on every push to main and every PR sync. On PR close, deletes
# every tag we ever assigned for that PR so the underlying tarballs become
# orphaned and the bucket cleans them up.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  PR_PACKAGE_HOST: 📦.alchemy.run
  NODE_VERSION: "24"

jobs:
  # ── Publish on push-to-main and PR sync. ──────────────────────────────────
  publish:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install

      - run: bun run build

      - name: Compute tags
        id: tags
        env:
          EVENT: ${{ github.event_name }}
          # `head_ref` for PRs (source branch), `ref_name` for push (e.g. "main").
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # PR builds run on the merge commit by default; tag the actual head sha
          # so consumers can pin to a specific PR commit.
          SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          short="${SHA:0:7}"
          long="$SHA"
          tags=("$short" "$long" "$BRANCH")
          if [ "$EVENT" = "pull_request" ]; then
            tags+=("pr-${PR_NUMBER}")
          fi
          json=$(printf '%s\n' "${tags[@]}" | jq -R . | jq -s -c .)
          echo "tags=$json" >> "$GITHUB_OUTPUT"
          echo "Tags: $json"

      - name: Publish alchemy
        env:
          TOKEN: ${{ secrets.PR_PACKAGE_TOKEN }}
          TAGS: ${{ steps.tags.outputs.tags }}
        working-directory: packages/alchemy
        run: |
          set -euo pipefail
          rm -f *.tgz
          bun pm pack --destination .
          tgz=$(ls *.tgz)
          echo "Publishing $tgz with tags $TAGS"
          curl -fsSL --show-error -X PUT \
            "https://${PR_PACKAGE_HOST}/projects/alchemy/packages" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "X-Tags: ${TAGS}" \
            -H "Content-Type: application/gzip" \
            --data-binary "@${tgz}"

      - name: Publish better-auth
        env:
          TOKEN: ${{ secrets.PR_PACKAGE_TOKEN }}
          TAGS: ${{ steps.tags.outputs.tags }}
        working-directory: packages/better-auth
        run: |
          set -euo pipefail
          rm -f *.tgz
          bun pm pack --destination .
          tgz=$(ls *.tgz)
          echo "Publishing $tgz with tags $TAGS"
          curl -fsSL --show-error -X PUT \
            "https://${PR_PACKAGE_HOST}/projects/better-auth/packages" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "X-Tags: ${TAGS}" \
            -H "Content-Type: application/gzip" \
            --data-binary "@${tgz}"

  # ── Cleanup on PR close (merged or not). ──────────────────────────────────
  # Deletes the branch tag, pr-<number> tag, and short+long sha tags for every
  # commit in the PR. 404s are ignored (tag may have been TTL'd or never set).
  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete tags
        env:
          TOKEN: ${{ secrets.PR_PACKAGE_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Collect every commit sha that appeared in the PR (paginated).
          shas=$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/commits" --jq '.[].sha')

          tags=()
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            tags+=("$sha" "${sha:0:7}")
          done <<< "$shas"
          tags+=("$BRANCH" "pr-${PR_NUMBER}")

          # Dedupe.
          unique=$(printf '%s\n' "${tags[@]}" | sort -u)

          for project in alchemy better-auth; do
            while IFS= read -r tag; do
              [ -z "$tag" ] && continue
              # URL-encode the tag (branch names can contain `/`).
              encoded=$(jq -rn --arg t "$tag" '$t|@uri')
              code=$(curl -sS -o /dev/null -w "%{http_code}" -X DELETE \
                "https://${PR_PACKAGE_HOST}/projects/${project}/tags/${encoded}" \
                -H "Authorization: Bearer ${TOKEN}")
              echo "DELETE ${project}:${tag} → ${code}"
            done <<< "$unique"
          done
